# Publishes an Expo EAS Update (OTA) for Android — no native rebuild.
# Required repo secret: EXPO_TOKEN (https://expo.dev/accounts/[account]/settings/access-tokens)
#
# Runs on push to main only if the pushed commit message contains [deploy:all] or [deploy:app].
# Plain git push (no tag) does not run this workflow. Use: ./scripts/push-deploy.sh -app
# Or put [deploy:app] in your commit message. workflow_dispatch always runs.

name: Deploy Mobile (EAS OTA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-mobile-ota
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ota:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' && (
          contains(github.event.head_commit.message, '[deploy:all]') ||
          contains(github.event.head_commit.message, '[deploy:app]')
        ))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        # expo-github-action installs eas-cli with yarn. After corepack enable,
        # yarn is a shim and this repo is pnpm, so that install exits 1.
        run: npm install -g eas-cli

      - name: Publish OTA update (Android)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Baked into the OTA JS bundle (same as website production API)
          EXPO_PUBLIC_BASE_URL: https://api.apnarojgarindia.com/api/v1
        run: |
          eas update \
            --branch production \
            --platform android \
            --message "main: ${{ github.sha }}" \
            --non-interactive
