# Renew Let's Encrypt TLS for api.apnarojgarindia.com on the EC2 nginx host.
# Let's Encrypt max lifetime is 90 days; this job force-renews for a full term.
#
# Secrets: same as deploy-backend-ec2.yml (EC2_HOST, EC2_USER, EC2_SSH_KEY or
# EC2_SSH_KEY_B64, optional EC2_SSH_KEY_PASSPHRASE).
#
# Trigger: GitHub → Actions → Renew API SSL (Let's Encrypt) → Run workflow

name: Renew API SSL (Let's Encrypt)

on:
  workflow_dispatch:
    inputs:
      force_renew:
        description: "Force a new 90-day cert even if the current one is still valid"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: renew-api-ssl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && KEY=~/.ssh/deploy_key.pem
          if [ -n "${{ secrets.EC2_SSH_KEY_B64 }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > "$KEY"
          elif [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY }}" > "$KEY"
          else
            echo "Set EC2_SSH_KEY or EC2_SSH_KEY_B64"; exit 1
          fi
          chmod 600 "$KEY"

      - name: Renew certificate and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          FORCE_RENEW: ${{ github.event.inputs.force_renew || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/deploy_key.pem
          passphrase: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}
          command_timeout: 12m
          script_stop: true
          envs: FORCE_RENEW
          script: |
            set -e -o pipefail
            LIVE=/etc/letsencrypt/live/api.apnarojgarindia.com/fullchain.pem
            echo "=== host ==="
            hostname
            date -u
            echo "=== certbot ==="
            command -v certbot || true
            sudo certbot certificates || true

            needs_renew=0
            if [ "${FORCE_RENEW:-false}" = "true" ]; then
              needs_renew=1
              echo "force_renew input is true"
            else
              end="$(sudo openssl x509 -enddate -noout -in "$LIVE" | cut -d= -f2)"
              end_epoch="$(date -u -d "$end" +%s)"
              now_epoch="$(date -u +%s)"
              days_left=$(( (end_epoch - now_epoch) / 86400 ))
              echo "days_left=$days_left"
              if [ "$days_left" -lt 30 ]; then
                needs_renew=1
              fi
            fi

            if [ "$needs_renew" -eq 1 ]; then
              renew_ok=0
              if sudo certbot renew --force-renewal --non-interactive --nginx; then
                renew_ok=1
                echo "renewed via: certbot renew --nginx"
              elif sudo certbot certonly --nginx --force-renewal --non-interactive --agree-tos -d api.apnarojgarindia.com; then
                renew_ok=1
                echo "renewed via: certonly --nginx"
              else
                echo "nginx plugin failed; trying standalone (brief nginx stop)"
                sudo systemctl stop nginx
                if sudo certbot certonly --standalone --force-renewal --non-interactive --agree-tos -d api.apnarojgarindia.com; then
                  renew_ok=1
                  echo "renewed via: certonly --standalone"
                fi
                sudo systemctl start nginx
              fi
              if [ "$renew_ok" -ne 1 ]; then
                echo "ERROR: Let's Encrypt renewal failed"
                sudo systemctl is-active nginx || sudo systemctl start nginx || true
                exit 1
              fi
              sudo nginx -t
              sudo systemctl reload nginx || sudo nginx -s reload
            else
              echo "Skipping issuance; cert still has 30+ days. Enabling auto-renew only."
            fi

            echo "=== enable auto-renew ==="
            sudo systemctl list-unit-files | grep -i certbot || true
            sudo systemctl enable --now certbot.timer 2>/dev/null || true
            sudo systemctl enable --now certbot-renew.timer 2>/dev/null || true
            sudo systemctl enable --now snap.certbot.renew.timer 2>/dev/null || true
            if [ -f /etc/cron.d/certbot ]; then
              echo "found /etc/cron.d/certbot"
              sudo cat /etc/cron.d/certbot || true
            elif ! sudo crontab -l 2>/dev/null | grep -q certbot; then
              echo "installing daily certbot cron"
              sudo bash -c 'echo "0 3 * * * root certbot renew --quiet --nginx --deploy-hook \"systemctl reload nginx\"" > /etc/cron.d/certbot'
              sudo chmod 644 /etc/cron.d/certbot
            fi
            sudo systemctl list-timers 'certbot*' --all 2>/dev/null || true
            echo "=== cron.d ==="
            sudo ls -la /etc/cron.d/ 2>/dev/null || true

            echo "=== leaf cert ==="
            sudo openssl x509 -in "$LIVE" -noout -subject -issuer -dates
            echo "=== done ==="
            date -u
