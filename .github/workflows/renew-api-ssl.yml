# Renew Let's Encrypt TLS for api.apnarojgarindia.com on the EC2 nginx host.
# Let's Encrypt max lifetime is 90 days.
#
# Secrets: same as deploy-backend-ec2.yml (EC2_HOST, EC2_USER, EC2_SSH_KEY or
# EC2_SSH_KEY_B64, optional EC2_SSH_KEY_PASSPHRASE).
#
# Trigger: GitHub → Actions → Renew API SSL (Let's Encrypt) → Run workflow
# Leave force_renew off unless you really need a brand-new 90-day cert.

name: Renew API SSL (Let's Encrypt)

on:
  workflow_dispatch:
    inputs:
      force_renew:
        description: "Force a new 90-day cert even if the current one is still valid"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: renew-api-ssl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && KEY=~/.ssh/deploy_key.pem
          if [ -n "${{ secrets.EC2_SSH_KEY_B64 }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > "$KEY"
          elif [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY }}" > "$KEY"
          else
            echo "Set EC2_SSH_KEY or EC2_SSH_KEY_B64"; exit 1
          fi
          chmod 600 "$KEY"

      - name: Renew certificate and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          FORCE_RENEW: ${{ github.event.inputs.force_renew || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/deploy_key.pem
          passphrase: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}
          command_timeout: 12m
          script_stop: false
          envs: FORCE_RENEW
          script: |
            set +e
            echo "=== host ==="
            hostname
            date -u
            echo "FORCE_RENEW=${FORCE_RENEW:-false}"
            echo "=== certbot certificates ==="
            sudo certbot certificates

            if [ "$FORCE_RENEW" = "true" ]; then
              echo "=== force renew (full 90-day term) ==="
              sudo certbot renew --force-renewal --non-interactive --nginx
            else
              echo "=== renew only if within 30 days ==="
              sudo certbot renew --non-interactive --nginx
            fi
            if [ $? -ne 0 ]; then
              echo "ERROR: certbot renew failed"
              sudo systemctl start nginx >/dev/null 2>&1
              exit 1
            fi

            sudo nginx -t
            sudo systemctl reload nginx || sudo nginx -s reload

            echo "=== enable auto-renew ==="
            sudo systemctl list-unit-files | grep -i certbot
            sudo systemctl enable --now certbot.timer
            sudo systemctl enable --now certbot-renew.timer
            sudo ls -la /etc/cron.d/
            if sudo test -f /etc/cron.d/certbot; then
              echo "found /etc/cron.d/certbot"
              sudo cat /etc/cron.d/certbot
            else
              echo "installing daily certbot cron"
              echo '0 3 * * * root certbot renew --quiet --nginx --deploy-hook "systemctl reload nginx"' | sudo tee /etc/cron.d/certbot
              sudo chmod 644 /etc/cron.d/certbot
            fi
            sudo systemctl list-timers --all | grep -i certbot

            echo "=== leaf cert ==="
            sudo certbot certificates
            echo "=== done ==="
            date -u
            exit 0
