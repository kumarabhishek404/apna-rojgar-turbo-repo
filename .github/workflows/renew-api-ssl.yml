# Renew Let's Encrypt TLS for api.apnarojgarindia.com on the EC2 nginx host.
# Let's Encrypt max lifetime is 90 days; this job force-renews for a full term.
#
# Secrets: same as deploy-backend-ec2.yml (EC2_HOST, EC2_USER, EC2_SSH_KEY or
# EC2_SSH_KEY_B64, optional EC2_SSH_KEY_PASSPHRASE).
#
# Trigger: GitHub → Actions → Renew API SSL (Let's Encrypt) → Run workflow

name: Renew API SSL (Let's Encrypt)

on:
  workflow_dispatch:

concurrency:
  group: renew-api-ssl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && KEY=~/.ssh/deploy_key.pem
          if [ -n "${{ secrets.EC2_SSH_KEY_B64 }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > "$KEY"
          elif [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "${{ secrets.EC2_SSH_KEY }}" > "$KEY"
          else
            echo "Set EC2_SSH_KEY or EC2_SSH_KEY_B64"; exit 1
          fi
          chmod 600 "$KEY"

      - name: Renew certificate and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/deploy_key.pem
          passphrase: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}
          command_timeout: 12m
          script_stop: true
          script: |
            set -e -o pipefail
            echo "=== host ==="
            hostname
            date -u
            echo "=== certbot ==="
            command -v certbot || sudo command -v certbot || true
            sudo certbot certificates || true
            echo "=== live files ==="
            sudo ls -la /etc/letsencrypt/live/ 2>/dev/null || true

            renew_ok=0
            if sudo certbot renew --force-renewal --non-interactive --nginx; then
              renew_ok=1
              echo "renewed via: certbot renew --nginx"
            elif sudo certbot certonly --nginx --force-renewal --non-interactive --agree-tos -d api.apnarojgarindia.com; then
              renew_ok=1
              echo "renewed via: certonly --nginx"
            else
              echo "nginx plugin failed; trying standalone (brief nginx stop)"
              sudo systemctl stop nginx
              if sudo certbot certonly --standalone --force-renewal --non-interactive --agree-tos -d api.apnarojgarindia.com; then
                renew_ok=1
                echo "renewed via: certonly --standalone"
              fi
              sudo systemctl start nginx
            fi

            if [ "$renew_ok" -ne 1 ]; then
              echo "ERROR: Let's Encrypt renewal failed"
              sudo systemctl is-active nginx || sudo systemctl start nginx || true
              exit 1
            fi

            sudo nginx -t
            sudo systemctl reload nginx || sudo nginx -s reload

            echo "=== timers ==="
            sudo systemctl list-timers 'certbot*' --all 2>/dev/null || true
            sudo systemctl enable --now certbot.timer 2>/dev/null || true
            sudo systemctl enable --now snap.certbot.renew.timer 2>/dev/null || true

            echo "=== new leaf cert ==="
            LIVE="$(sudo ls -d /etc/letsencrypt/live/api.apnarojgarindia.com* 2>/dev/null | head -n 1)"
            if [ -n "$LIVE" ] && [ -f "$LIVE/fullchain.pem" ]; then
              sudo openssl x509 -in "$LIVE/fullchain.pem" -noout -subject -issuer -dates
            fi
            echo "=== done ==="
            date -u
